apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-db-pvc
  namespace: portfolio-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-db
  namespace: portfolio-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portfolio-db
  template:
    metadata:
      labels:
        app: portfolio-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: portfolio_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: portfolio-db-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: portfolio-db-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "portfolio_user"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: portfolio-db-storage
          persistentVolumeClaim:
            claimName: portfolio-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-db
  namespace: portfolio-app
spec:
  selector:
    app: portfolio-db
  ports:
    - port: 5432
      targetPort: 5432
